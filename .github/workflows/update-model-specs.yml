name: Update model specs

# Refreshes the bundled model specification snapshot
# (Sources/DrawThingsClient/Resources/models.json) from the live list the Draw Things app
# downloads, and opens a pull request when it changed. Merge it and tag a patch release so
# new models work without a runtime network request.

on:
  schedule:
    - cron: "17 6 * * 1"  # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Refresh models.json
        id: refresh
        run: |
          {
            echo 'summary<<EOF'
            Scripts/update-model-specs.sh
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/update-model-specs
          delete-branch: true
          commit-message: Update bundled model specs
          title: Update bundled model specs
          body: |
            Automated refresh of `Sources/DrawThingsClient/Resources/models.json` from
            https://models.drawthings.ai/models.json.

            ```
            ${{ steps.refresh.outputs.summary }}
            ```

            After merging, tag a patch release so clients pick up the new models.
          add-paths: Sources/DrawThingsClient/Resources/models.json
